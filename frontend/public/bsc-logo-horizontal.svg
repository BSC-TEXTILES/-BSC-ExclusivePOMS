<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180">
  <defs>
    <linearGradient id="hGoldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E498" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#E8C364" />
    </linearGradient>
    <linearGradient id="hGoldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="hNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14284B" />
      <stop offset="100%" stop-color="#071326" />
    </linearGradient>
    <filter id="hShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left: Emblem (scaled to 140x140 at x=90, y=90) -->
  <g transform="translate(90, 90) scale(0.18)" filter="url(#hShadow)">
    <circle cx="0" cy="0" r="380" fill="#071326" stroke="url(#hGoldLinear)" stroke-width="12" />
    <circle cx="0" cy="0" r="350" fill="url(#hNavy)" stroke="url(#hGoldLinear)" stroke-width="4" stroke-dasharray="8 8" />
    <circle cx="0" cy="0" r="230" fill="#040913" stroke="url(#hGoldLinear)" stroke-width="6" />
    
    <!-- Kalasha motif -->
    <g transform="translate(0, -140) scale(1.6)" fill="url(#hGoldLight)">
      <path d="M 0,-25 C 5,-18 7,-12 7,-8 C 7,-3 4,0 0,0 C -4,0 -7,-3 -7,-8 C -7,-12 -5,-18 0,-25 Z" />
      <path d="M 0,0 C 12,-6 24,-4 28,6 C 18,8 10,6 0,0 Z" />
      <path d="M 0,0 C -12,-6 -24,-4 -28,6 C -18,8 -10,6 0,0 Z" />
    </g>

    <!-- BSC Monogram -->
    <g font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-weight="900" text-anchor="middle" dominant-baseline="central">
      <text x="0" y="10" font-size="190" fill="url(#hGoldLinear)" stroke="#4A2F08" stroke-width="3">S</text>
      <text x="-90" y="0" font-size="160" fill="url(#hGoldLight)">B</text>
      <text x="90" y="0" font-size="160" fill="url(#hGoldLight)">C</text>
    </g>

    <!-- Ribbon -->
    <g transform="translate(0, 150)">
      <rect x="-190" y="-22" width="380" height="44" rx="10" fill="url(#hGoldLinear)" stroke="#FFF" stroke-width="2" />
      <text x="0" y="6" text-anchor="middle" dominant-baseline="central"
            font-family="'Montserrat', 'Cinzel', sans-serif" font-size="25" font-weight="900" letter-spacing="6"
            fill="#071326">BSC EXCLUSIVE</text>
    </g>
  </g>

  <!-- Right: Corporate Typography Lockup -->
  <!-- Line 1: B. S. CHANNABASAPPA & SONS -->
  <text x="180" y="68"
        font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="28" font-weight="700" letter-spacing="3"
        fill="#0F284E">
    B. S. CHANNABASAPPA &amp; SONS
  </text>

  <!-- Line 2: BSC EXCLUSIVE (with Gold Highlight Badge) -->
  <text x="180" y="108"
        font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="26" font-weight="800" letter-spacing="5"
        fill="#B8860B">
    BSC EXCLUSIVE
  </text>

  <!-- Decorative Separator Line -->
  <line x1="180" y1="124" x2="680" y2="124" stroke="url(#hGoldLinear)" stroke-width="1.8" />
  <circle cx="180" cy="124" r="2.5" fill="#B8860B" />
  <circle cx="680" cy="124" r="2.5" fill="#B8860B" />

  <!-- Line 3: Heritage Sub-descriptor -->
  <text x="182" y="148"
        font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="2.5"
        fill="#556B82">
    DAVANAGERE, KARNATAKA  &#8226;  ESTABLISHED 1938  &#8226;  PURCHASE ORDER SYSTEM
  </text>
</svg>
